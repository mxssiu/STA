<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game Tempi di reazione</title>
    <style>
        .contenitore {
            display: flex;
            margin-top: 50px;
            justify-content: center;
            gap: 10px;
        }

        .color-button {
            color: white;
            width: 100px;
            height: 100px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-size: 16px;
        }

        #titolo_game {
            text-align: center;
            margin-top: 30px;
            font-size: 20px;
            font-family: sans-serif;
        }
    </style>
</head>
<body>

    <div id="titolo_game">
        Clicca sul bottone rosso
    </div>

    <div class="contenitore">
        <button id="btn1" class="color-button"></button>
        <button id="btn2" class="color-button"></button>
        <button id="btn3" class="color-button"></button>
        <button id="btn4" class="color-button"></button>
    </div>

</body>
</html>
